<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 448" width="100%" height="auto" role="img" style="color:var(--fg);max-width:620px;height:auto"><title>Même bilan, deux capitalisations : le book-to-market les range en Value et en Growth</title><g transform="translate(0 0)"><g transform="translate(0 0)"><text x="145" y="18.1" text-anchor="middle" font-size="13" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">entreprise 1 : Value</text><text x="81.06" y="41.36" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">bilan (comptes)</text><rect x="19.9" y="75.78" width="55.6" height="260.53" fill="var(--mut)" fill-opacity="0.25" rx="1.5"/><text x="47.7" y="206.05" text-anchor="middle" font-size="10.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">actifs 100</text><rect x="86.62" y="127.89" width="55.6" height="208.42" fill="var(--li2)" fill-opacity="0.6" rx="1.5"/><text x="114.42" y="232.1" text-anchor="middle" font-size="10.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">dette 80</text><rect x="86.62" y="75.78" width="55.6" height="52.11" fill="var(--acc)" fill-opacity="0.35" rx="1.5"/><text x="114.42" y="105.84" text-anchor="middle" font-size="10.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">E = 20</text><text x="217.28" y="41.36" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">bourse</text><rect x="189.48" y="271.18" width="55.6" height="65.13" fill="var(--acc)" fill-opacity="0.6" rx="1.5"/><defs><filter id="fond-etiquette" x="-0.03" y="-0.12" width="1.06" height="1.24"><feFlood style="flood-color:var(--card)"/></filter></defs><text x="217.28" y="265.18" text-anchor="middle" font-size="10.5" fill="none" filter="url(#fond-etiquette)" font-family="ui-sans-serif,system-ui,sans-serif">capitalisation 25</text><text x="217.28" y="265.18" text-anchor="middle" font-si