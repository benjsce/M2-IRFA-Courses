<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="auto" role="img" style="color:var(--fg);max-width:600px;height:auto"><title>R² : la part de la dispersion que la droite emporte</title><text x="31.48" y="30.54" text-anchor="start" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">dispersion totale  Σ(Y<tspan dy="3.12" font-size="9">t</tspan><tspan dy="-3.12"> − Ȳ)² = 2477</tspan></text><rect x="31.48" y="51.07" width="537.04" height="24.64" fill="var(--mut)" fill-opacity="0.3" rx="1.5"/><rect x="31.48" y="108.57" width="262.44" height="24.64" fill="var(--acc)" fill-opacity="0.35" rx="1.5"/><rect x="293.92" y="108.57" width="274.6" height="24.64" fill="var(--ajo)" fill-opacity="0.35" rx="1.5"/><text x="162.7" y="124.89" text-anchor="middle" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">expliqué par le marché : 1210</text><text x="431.22" y="124.89" text-anchor="middle" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">résidus  Σ(Y<tspan dy="3" font-size="8.64">t</tspan><tspan dy="-3"> − Ŷ</tspan><tspan dy="3" font-size="8.64">t</tspan><tspan dy="-3">)² = 1266</tspan></text><path d="M31.48 149.64 L293.92 149.64 M31.48 151.64 l0 -4 M293.92 151.64 l0 -4" stroke="var(--acc)" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="162.7" y="169.64" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">R² = 1 − 1266 / 2477 = 0,489</text><text x="300" y="232" text-anchor="middle" font-size="14" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">R² = 1 − Σ(Y<tspan dy="3.5" font-size="10.08">t</tspan><tspan dy="-3.5"> − Ŷ</tspan><tspan dy="3.5" font-size="10.08">t</tspan><tspan dy="-3.5">)² / Σ(Y</tspan><tspan dy="3.5" font-size="10.08">t</tspan><tspan dy="-3.5"> − Ȳ)²</tspan></text></svg>
