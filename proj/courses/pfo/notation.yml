collisions:
- symbole: $S_t$
  ici: fourchette acheteur-vendeur (éq. 1.1)
  ailleurs:
    fpp: prix comptant du sous-jacent
  note: >-
    le plus trompeur des deux cours voisins : en pfo, $S_t$ est un écart de prix de
    quelques centimes, pas le prix lui-même
- symbole: $S$
  ici: coefficient d'asymétrie (éq. 2.1)
  ailleurs:
    dup: espace des états du monde
- symbole: $K$
  ici: kurtosis, de Pearson ou en excès selon la page
  ailleurs:
    fpp: strike
    dup: ensemble des probabilités a priori
- symbole: $\sigma$
  ici: écart type, d'un groupe ou d'un rendement
  ailleurs:
    fpp: volatilité, écart type du rendement
    dup: écart type d'une perspective
  note: le même objet dans les trois cours, à l'annualisation près
- symbole: $\mu$
  ici: >-
    moyenne, ou espérance du rendement ; au chapitre 3, vecteur des rendements espérés
    (§3.0.1), puis multiplicateurs des contraintes d'inégalité du lagrangien (éq. 3.6)
  ailleurs:
    fpp: dérive du sous-jacent sous la probabilité historique
    dup: espérance d'une perspective
- symbole: $\lambda$
  ici: >-
    persistance EWMA ; au chapitre 3, multiplicateurs des contraintes d'égalité du
    lagrangien (éq. 3.6)
  ailleurs:
    dss: paramètre de pénalité de ridge et du lasso
    dup: coefficient d'aversion aux pertes
- symbole: $\alpha$
  ici: >-
    quatre sens dans ce seul cours — lissage EWMA, niveau d'un test, seuil de la VaR,
    puis part investie dans le portefeuille tangent (p. 41) ; $\alpha_k$, le pas de
    SLSQP (éq. 3.5), en est distinct par son indice
  ailleurs:
    dss: coefficient d'inertie
    dup: coefficient linéaire de l'utilité quadratique
- symbole: $W$
  ici: >-
    statistique de Shapiro-Wilk ; au chapitre 3, vecteur des poids du portefeuille
    (§3.0.1)
  ailleurs:
    dss: nombre de poids du réseau
- symbole: $L$
  ici: perte du portefeuille
  ailleurs:
    dss: vraisemblance maximisée
- symbole: $\delta$
  ici: correction de Cornish-Fisher du quantile normal
  ailleurs:
    fpp: delta d'une option
- symbole: $\varphi$
  ici: densité de la loi normale centrée réduite (Listing 2.2)
  ailleurs:
    dup: fonction de distorsion des probabilités
- symbole: $F$
  ici: fonction de répartition (p. 34)
  ailleurs:
    dup: ensemble des actes, puis fonction de répartition de la richesse
    fpp: prix forward
- symbole: $\sigma_p$
  ici: écart type du portefeuille de N actifs, $\sqrt{W^T\Sigma W}$ (p. 38)
  ailleurs:
    dup: écart type d'un portefeuille de deux actifs (L1 slide 13)
  note: >-
    le même objet dans les deux cours : dup/diversification en est le cas à deux actifs,
    et pfo/moments-du-portefeuille s'appuie dessus
- symbole: $f$
  ici: fonction objectif d'un problème d'optimisation (éq. 3.1)
  ailleurs:
    dup: un acte, application des états vers les résultats (L1 slide 2)
