# Registre des notations de pfo (SPEC-MODELE A12).
# Le poly surcharge deux symboles : $\alpha$ désigne trois objets (paramètre de lissage
# EWMA, niveau de signification d'un test, seuil de la VaR), et $K$ désigne tantôt la
# kurtosis de Pearson (éq. 2.2, éq. 2.5), tantôt l'excès de kurtosis (§2.3, éq. 2.26).
# Le registre garde le symbole de la source et porte une entrée par sens, rattachée à la
# fiche qui l'emploie — comme dup le fait pour $K$ et dss pour $\lambda$.
