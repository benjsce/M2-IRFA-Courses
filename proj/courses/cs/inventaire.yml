# Inventaire de la source (SPEC-MODELE A13), dans l'ordre des slides.
# Traité le 2026-10-01 : les trois premiers chapitres, jusqu'à « Properties of the BM »
# exclu (pages 1 à 24 du PDF). Le reste des slides n'est pas encore inventorié.
# La page de garde du document (« Slides for the Stochastic Calculus Course ») n'a pas
# de contenu propre et n'est pas un élément.
elements:
# -- §0.3 Gaussian vectors (5 slides)
- ref: '§0.3'
  intitule: 'Gaussian vectors'
  exclu: 'titre de chapitre ; ses énoncés sont inventoriés un par un'
- ref: 'Déf. 0.3.1'
  intitule: 'Gaussian vector'
  notion: 'cs/vecteur-gaussien'
- ref: '§0.3 slide 2'
  intitule: 'Example : independent Gaussian random variables form a Gaussian vector'
  absorbe: 'cs/vecteur-gaussien'
- ref: 'Prop. 0.3.1'
  intitule: 'Characteristic function of a Gaussian vector ; X follows a N(m, Σ)'
  notion: 'cs/loi-gaussienne-multivariee'
- ref: 'Cor. 0.3.1'
  intitule: 'X₁ ⊥ X₂ ⇔ cov(X₁, X₂) = 0 for a Gaussian vector of ℝ²'
  notion: 'cs/independance-gaussienne'
- ref: 'Exercice 0.3.1'
  intitule: 'Z ⊥ Xᵢ for all i implies Z ⊥ (X₁, …, Xₙ)'
  absorbe: 'cs/independance-gaussienne'
- ref: 'Exercice 0.3.2'
  intitule: 'm + AG follows a N(m, AAᵗ) ; simulating an arbitrary Gaussian vector'
  absorbe: 'cs/loi-gaussienne-multivariee'
- ref: 'Prop. 0.3.2'
  intitule: 'Density of a N(m, Σ) when Σ is nonsingular ; the singular case'
  notion: 'cs/densite-gaussienne'
# -- §0.4 Conditional expectation (7 slides)
- ref: '§0.4'
  intitule: 'Conditional expectation'
  exclu: 'titre de chapitre ; ses énoncés sont inventoriés un par un'
- ref: 'Déf. 0.4.1'
  intitule: 'Definition (Theorem) : conditional expectation of X given 𝒢'
  notion: 'cs/esperance-conditionnelle'
- ref: 'Déf. 0.4.2'
  intitule: 'E[X|Y] = E[X|σ(Y)]'
  notion: 'cs/esperance-conditionnelle-sachant-une-variable'
- ref: 'Rem. 0.4.3'
  intitule: 'The preceding definition rewritten : σ(Y)-measurable, E[Xg(Y)] = E[E[X|Y]g(Y)]'
  absorbe: 'cs/esperance-conditionnelle-sachant-une-variable'
- ref: '§0.4 slide 4'
  intitule: 'Classical properties of an expecation (intertitre)'
  absorbe: 'cs/proprietes-heritees-de-l-esperance'
- ref: 'Prop. 0.4.1'
  intitule: 'Positivity, linearity, monotony, Beppo-Lévy, Fatou, dominated convergence, Jensen'
  notion: 'cs/proprietes-heritees-de-l-esperance'
- ref: '§0.4 slide 5'
  intitule: 'Specific properties (intertitre)'
  exclu: 'intertitre ; les cinq propriétés de la Prop. 0.4.2 sont inventoriées une par une'
- ref: 'Prop. 0.4.2 a)'
  intitule: 'E[E[X|𝒢]] = E[X]'
  absorbe: 'cs/propriete-de-la-tour'
- ref: 'Prop. 0.4.2 b)'
  intitule: 'If X is 𝒢-measurable, E[X|𝒢] = X'
  absorbe: 'cs/sortir-ce-qui-est-connu'
- ref: 'Prop. 0.4.2 c)'
  intitule: 'Taking out what is known'
  notion: 'cs/sortir-ce-qui-est-connu'
- ref: 'Prop. 0.4.2 d)'
  intitule: 'Role of independence'
  notion: 'cs/role-de-l-independance'
- ref: 'Prop. 0.4.2 e)'
  intitule: 'Tower property'
  notion: 'cs/propriete-de-la-tour'
- ref: 'Prop. 0.4.3'
  intitule: 'An important result : E[Φ(X, Y)|𝒢] = ψ(Y), ψ(y) = E[Φ(X, y)]'
  notion: 'cs/lemme-de-gel'
- ref: 'Prop. 0.4.4'
  intitule: 'Conditional expectation and Gaussian vectors : E[Z|X₁, …, Xₙ] = a + Σ Xᵢbᵢ'
  notion: 'cs/esperance-conditionnelle-gaussienne'
# -- §0.5 Stochastic processes (12 slides)
- ref: '§0.5'
  intitule: 'Stochastic processes'
  exclu: 'titre de chapitre ; ses énoncés sont inventoriés un par un'
- ref: 'Déf. 0.5.1'
  intitule: 'Stochastic process'
  notion: 'cs/processus-stochastique'
- ref: 'Déf. 0.5.2'
  intitule: 'Equidistributed processes'
  notion: 'cs/processus-de-meme-loi'
- ref: 'Déf. 0.5.3'
  intitule: 'Version of a process'
  notion: 'cs/version-d-un-processus'
- ref: 'Déf. 0.5.4'
  intitule: 'Indistinguishable processes'
  notion: 'cs/processus-indistinguables'
- ref: '§0.5 slide 3'
  intitule: 'Rk : these definitions are more and more restrictive'
  absorbe: 'cs/processus-indistinguables'
- ref: 'Déf. 0.5.5'
  intitule: 'Continuous process'
  notion: 'cs/processus-continu'
- ref: '§0.5 slide 4'
  intitule: 'Exercise : continuous versions are indistinguishable ; a version that is not indistinguishable'
  absorbe: 'cs/processus-indistinguables'
- ref: 'Déf. 0.5.6'
  intitule: 'Measurable process'
  notion: 'cs/processus-mesurable'
- ref: '§0.5 slide 5'
  intitule: 'Rk : Y_t = ∫₀ᵗ f(X_s)ds is a random variable when X is measurable'
  absorbe: 'cs/processus-mesurable'
- ref: '§0.5 slide 5'
  intitule: 'Exercise : a continuous process is measurable'
  absorbe: 'cs/processus-mesurable'
- ref: 'Déf. 0.5.7'
  intitule: 'L²(Ω × [0, T]), the Hilbert space of squared integrable processes'
  notion: 'cs/espace-l2-des-processus'
- ref: 'Déf. 0.5.8'
  intitule: 'Filtration ; complete filtration'
  notion: 'cs/filtration'
- ref: 'Rem. 0.5.3'
  intitule: 'A filtration is always supposed complete'
  notion: 'cs/filtration-complete'
- ref: 'Déf. 0.5.9'
  intitule: 'Adapted process'
  notion: 'cs/processus-adapte'
- ref: 'Rem. 0.5.4'
  intitule: 'A process is always adapted to its natural filtration'
  notion: 'cs/filtration-naturelle'
- ref: 'Rem. 0.5.5'
  intitule: 'Advantages of complete filtrations'
  absorbe: 'cs/filtration-complete'
- ref: 'Déf. 0.5.10'
  intitule: 'Progressively measurable process'
  notion: 'cs/processus-progressivement-mesurable'
- ref: 'Rem. 0.5.6'
  intitule: 'A progressively measurable process is measurable and adapted'
  absorbe: 'cs/processus-progressivement-mesurable'
- ref: '§0.5 slide 11'
  intitule: 'Exercise : the process (1) is progressively measurable ; the set ℰ([0, T] × Ω)'
  notion: 'cs/processus-elementaire'
- ref: '§0.5 éq. 1'
  intitule: 'X_t = Σ F_{t_i} 1_{[t_i, t_{i+1}[}(t)'
  absorbe: 'cs/processus-elementaire'
- ref: '§0.5 slide 11'
  intitule: 'Exercise : Y_t = ∫₀ᵗ f(X_s)ds is adapted when X is progressively measurable (Fubini)'
  absorbe: 'cs/processus-progressivement-mesurable'
- ref: 'Prop. 0.5.1'
  intitule: 'A continuous adapted process is progressively measurable'
  absorbe: 'cs/processus-progressivement-mesurable'
- ref: 'Déf. 0.5.11'
  intitule: 'L²_prog(Ω × [0, T])'
  notion: 'cs/espace-l2-progressif'
- ref: 'Th. 0.5.2'
  intitule: 'L²_prog is complete ; ℰ([0, T] × Ω) is dense in it'
  notion: 'cs/densite-des-processus-elementaires'
