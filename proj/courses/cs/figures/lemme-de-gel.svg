<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 250" width="100%" height="auto" role="img" style="color:var(--fg);max-width:630px;height:auto"><title>E(Φ(X,Y)|𝒢) = ψ(Y), avec ψ(y) = E(Φ(X,y))</title><g transform="translate(0 0)"><path d="M10 207.68 L290 207.68" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="15.6" y="46.25" width="128.8" height="161.43" fill="var(--acc)" fill-opacity="0.4" rx="1.5"/><text x="80" y="40.25" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Φ(1, 1) = 4</text><text x="80" y="223.68" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">X = 1, proba ½</text><rect x="155.6" y="167.32" width="128.8" height="40.36" fill="var(--acc)" fill-opacity="0.4" rx="1.5"/><text x="220" y="161.32" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Φ(0, 1) = 1</text><text x="220" y="223.68" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">X = 0, proba ½</text><path d="M10 106.79 L290 106.79" fill="none" stroke="var(--ajo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="18.4" y="99.79" text-anchor="start" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">ψ(1) = 2,5</text><text x="150" y="16" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Y = 1 gelée : premier lancer pile</text><text x="150" y="240" text-anchor="middle" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">ψ(1) = E(Φ(X, 1)), moyenne sur X seule</text></g><g transform="translate(330 0)"><path d="M10 207.68 L290 207.68" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-linecap="round" strok