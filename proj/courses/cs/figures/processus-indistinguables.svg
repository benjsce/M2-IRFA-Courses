07.74" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M241.54 287.58 L241.54 30.84" fill="none" stroke="var(--li2)" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><text x="241.54" y="26.84" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">t = 0,5 fixé : X<tspan dy="3.12" font-size="9">t</tspan><tspan dy="-3.12"> = Y</tspan><tspan dy="3.12" font-size="9">t</tspan><tspan dy="-3.12"> sauf si ω = 0,5,</tspan></text><text x="241.54" y="42.84" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">probabilité 0 : Y est une version de X</text><path d="M40 236.23 L443.08 107.86" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="451.08" y="111.86" text-anchor="start" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">ω = 0,3</text><circle cx="160.92" cy="197.72" r="5.2" fill="var(--ajo)"/><circle cx="160.92" cy="197.72" r="3.2" fill="var(--card)"/><path d="M160.92 197.72 L160.92 274.74" fill="none" stroke="var(--ajo)" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160.92" cy="274.74" r="4.4" fill="var(--ajo)"/><path d="M40 184.88 L443.08 56.51" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="451.08" y="60.51" text-anchor="start" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">ω = 0,7</text><circle cx="322.15" cy="95.02" r="5.2" fill="var(--ajo)"/><circle cx="322.15" cy="95.02" r="3.2" fill="var(--card)"/><path d="M322.15 95.02 L322.15 274.74" fill="none" stroke="var(--ajo)" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><circle c