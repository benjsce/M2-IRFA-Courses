</text><text x="34.06" y="18" text-anchor="start" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">det Σ = 0 : pas de densité</text><text x="172.19" y="217.62" text-anchor="start" font-size="12.5" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">toute la masse est</text><text x="172.19" y="233.62" text-anchor="start" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">sur X₁ − X₂ = −1</text><text x="34.06" y="296" text-anchor="start" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">le facteur 1 / det(Σ)<tspan dy="-4.2" font-size="8.64">1/2</tspan><tspan dy="4.2"> n'existe plus :</tspan></text><text x="34.06" y="313" text-anchor="start" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">une droite n'a pas de surface</text></g></svg>
