<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="100%" height="auto" role="img" style="color:var(--fg);max-width:560px;height:auto"><title>La part consommée compte βδ, la part épargnée δ : l'aire est le facteur effectif</title><path d="M83.81 16 L83.81 290 M58 290 L542 290" fill="none" stroke="var(--mut)" stroke-width="1.2"/><path d="M83.81 290 l0 4" stroke="var(--mut)" stroke-width="1.2"/><text x="83.81" y="307" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">0</text><path d="M298.92 290 l0 4" stroke="var(--mut)" stroke-width="1.2"/><text x="298.92" y="307" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">c₂′ = ⅔</text><path d="M406.48 290 l0 4" stroke="var(--mut)" stroke-width="1.2"/><text x="406.48" y="307" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">1</text><path d="M83.81 184.62 l-4 0" stroke="var(--mut)" stroke-width="1.2"/><text x="75.81" y="188.62" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">βδ = ½</text><path d="M83.81 149.49 l-4 0" stroke="var(--mut)" stroke-width="1.2"/><text x="75.81" y="153.49" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">⅔</text><path d="M83.81 79.23 l-4 0" stroke="var(--mut)" stroke-width="1.2"/><text x="75.81" y="83.23" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">δ = 1</text><text x="542" y="323" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">un euro de plus pour le moi 2</text><text x="39.81" y="10" text-anchor="start" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">poids pour le moi 1</text><rect x="83.81" y="184.62" width="215.11" height="105.38" fill="var(--acc)" fill-opacity="0.8" rx="1.5"/><rect x="298.92" y="79.23" width="107.56" height="210.77" fill="var(--ajo)" fill-opacity="0.7" rx="1.5"/><defs><filter id="fond-etiquette" x="-0.03" y="-0.12" width="1.06" height="1.24"><feFlood style="flood-color:var(--card)"/></filter></defs><text x="191.37" y="237.31" text-anchor="middle" font-size="12.5" fill="none" filter="url(#fond-etiquette)" font-family="ui-sans-serif,system-ui,sans-serif">consommé : c₂′ × βδ</text><text x="191.37" y="237.31" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">consommé : c₂′ × βδ</text><text x="352.7" y="176.62" text-anchor="middle" font-size="12.5" fill="none" filter="url(#fond-etiquette)" font-family="ui-sans-serif,system-ui,sans-serif">épargné :</text><text x="352.7" y="176.62" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">épargné :</text><text x="352.7" y="194.62" text-anchor="middle" font-size="12.5" fill="none" filter="url(#fond-etiquette)" font-family="ui-sans-serif,system-ui,sans-serif">(1 − c₂′) × δ</text><text x="352.7" y="194.62" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">(1 − c₂′) × δ</text><path d="M83.81 149.49 L425.84 149.49" fill="none" stroke="var(--fg)" stroke-width="1.4" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/><text x="429.07" y="145.49" text-anchor="start" font-size="12" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">facteur effectif</text><text x="429.07" y="161.49" text-anchor="start" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">= ⅔ × ½ + ⅓ × 1 = ⅔</text><text x="296.77" y="41.29" text-anchor="middle" font-size="13.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">u′(c₁) = [c₂′βδ + (1 − c₂′)δ] R u′(c₂)</text></svg>
