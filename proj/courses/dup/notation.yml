collisions:
- symbole: $F$
  ici: ensemble des actes (L1 slide 2)
  ailleurs:
    dup: fonction de répartition de la richesse aléatoire (L1 slide 6, L1 slide 19)
    fpp: prix forward
  note: >-
    collision interne à la source, la plus dangereuse du cours : le même $F$ désigne
    l'ensemble des actes puis une fonction de répartition, à quatre slides d'intervalle
- symbole: $\pi$
  ici: prime de risque (L1 slide 9)
  ailleurs:
    dup: croyance subjective (L1 slide 59), poids de décision (L3 slide 21)
    fpp: prime de risque au sens du rendement au-delà du coût de financement (§1.3)
  note: >-
    collision interne à la source, à surveiller dès l'ingestion des slides 59 et suivantes.
    La collision avec fpp est la plus trompeuse de la base : même lettre, même nom, et deux
    grandeurs différentes — voir l'homonymie déclarée plus bas
- symbole: $a$
  ici: part investie dans l'actif sans risque (L1 slide 12)
  ailleurs:
    dup: acte $a_1,\dots,a_4$ des choix d'Allais (L1 slide 42), variable de choix (L1 slide 26)
  note: collision interne à la source
- symbole: $\alpha$
  ici: coefficient de l'utilité quadratique (L1 slide 14)
  ailleurs:
    dup: poids de mélange des loteries (L1 slide 5), pénalité de déception (L3 slide 10)
  note: collision interne à la source
- symbole: $P$
  ici: une loterie (L1 slide 2)
  ailleurs:
    fpp: prix d'un zéro-coupon $P(t,T)$
  note: collision entre cours
- symbole: $\mu$
  ici: espérance d'une perspective (L1 slide 11)
  ailleurs:
    fpp: dérive du sous-jacent sous la probabilité historique (§5.4)
- symbole: $\sigma$
  ici: écart type d'une perspective (L1 slide 11)
  ailleurs:
    fpp: volatilité, écart type du rendement (Déf. 2)
  note: >-
    les deux sens sont voisins — un écart type dans les deux cas — mais l'un porte sur une
    richesse et l'autre sur un rendement
- symbole: $\gamma$
  ici: aversion relative constante de CRRA (L1 slide 35)
  ailleurs:
    fpp: sensibilité du delta au sous-jacent, la grecque gamma (§8.2)
homonymes:
- nom: Prime de risque
  entre:
  - dup/prime-de-risque
  - fpp/prime-de-risque
  note: >-
    même nom et même alias « risk premium » pour deux grandeurs distinctes : ce que l'agent
    abandonne sur la moyenne pour se débarrasser du risque (L1 slide 9), et le rendement
    d'un actif au-delà de son coût de financement (Déf. 2). Les deux cours emploient aussi
    la même lettre $\pi$. Ce n'est pas une faute : c'est le même mot pour deux objets, et
    il faut que les deux fiches existent
