<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="100%" height="auto" role="img" style="color:var(--fg);max-width:620px;height:auto"><title>Trois jeux séparés : un pour apprendre, un pour régler, un pour juger</title><text x="19.62" y="35.58" text-anchor="start" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">grand échantillon : un seul découpage, au hasard</text><rect x="19.62" y="42.58" width="278.77" height="27.66" fill="var(--mut)" fill-opacity="0.35" rx="1.5"/><rect x="298.38" y="42.58" width="127.77" height="27.66" fill="var(--ajo)" fill-opacity="0.55" rx="1.5"/><rect x="426.15" y="42.58" width="174.23" height="27.66" fill="var(--acc)" fill-opacity="0.85" rx="1.5"/><text x="159" y="60.41" text-anchor="middle" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">apprendre</text><text x="362.27" y="60.41" text-anchor="middle" font-size="12" fill="var(--card)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">régler</text><text x="513.27" y="60.41" text-anchor="middle" font-size="12" fill="var(--card)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">juger : production</text><text x="423.15" y="85.24" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">70 %</text><text x="600.38" y="85.24" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">30 %</text><text x="19.62" y="132.39" text-anchor="start" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">petit échantillon : dix blocs, et l'on recommence dix fois</text><rect x="21.65" y="139.39" width="54.01" height="27.66" fill="var(--mut)" fill-opacity="0.35" rx="1.5"/><rect x="79.72" y="139.39" width="54.01" height="27.66" fill="var(--mut)" fill-opacity="0.35" rx="1.5"/><rect x="137.8" y="139.39" width="54.01" height="27.66" fill="var(--m