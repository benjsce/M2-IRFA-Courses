-sans-serif,system-ui,sans-serif">−w0 / w2 = 1</text><text x="300" y="98.86" text-anchor="middle" font-size="12.5" fill="none" filter="url(#fond-etiquette)" font-family="ui-sans-serif,system-ui,sans-serif">f &gt; 0 : classe A</text><text x="300" y="98.86" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">f &gt; 0 : classe A</text><text x="118" y="281.14" text-anchor="middle" font-size="12.5" fill="none" filter="url(#fond-etiquette)" font-family="ui-sans-serif,system-ui,sans-serif">f &lt; 0 : classe B</text><text x="118" y="281.14" text-anchor="middle" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">f &lt; 0 : classe B</text><text x="209.47" y="249.31" text-anchor="start" font-size="11.5" fill="none" filter="url(#fond-etiquette)" font-family="ui-sans-serif,system-ui,sans-serif">x1 + x2 = 1</text><text x="209.47" y="249.31" text-anchor="start" font-size="11.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">x1 + x2 = 1</text></svg>
