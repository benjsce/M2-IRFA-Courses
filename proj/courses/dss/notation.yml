collisions:
- symbole: $\lambda$
  ou: dss/regression-ridge (slide 50) · dss/boosting (slide 126) · dss/decroissance-des-poids (slide 174)
  sens: >-
    trois emplois dans le même cours. Pénalité de ridge et du lasso ; taux
    d'apprentissage du boosting ; coût des poids de la décroissance. Le cours ne le
    signale jamais. Les trois valeurs typiques diffèrent d'un ordre de grandeur.
- symbole: $\lambda$
  ou: dss/regression-ridge · dup/aversion-aux-pertes
  sens: >-
    collision avec l'autre cours : ici un paramètre de pénalité, là le rapport
    d'aversion aux pertes
- symbole: $d$
  ou: dss/cp-de-mallows (slide 41) · dss/boosting (slide 126) · dss/regle-delta (slide 145)
  sens: >-
    trois emplois dans le même cours. Nombre de prédicteurs ; nombre de coupures par
    arbre ; signal d'erreur de la règle delta
- symbole: $m$
  ou: dss/foret-aleatoire (slide 113) · dss/garantie-pac (slide 168) · dss/reduction-de-dimension (slide 72)
  sens: >-
    prédicteurs tirés par coupure ; nombre d'exemples d'apprentissage ; indice de
    direction
- symbole: $\rho$
  ou: dss/variance-d-une-moyenne-correlee · dup/aversion-second-ordre
  sens: >-
    collision avec l'autre cours : ici une corrélation entre arbres, là l'aversion
    absolue au risque
- symbole: $\eta$
  ou: dss/regle-delta · dup/famille-hara
  sens: >-
    collision avec l'autre cours : ici le taux d'apprentissage, là un paramètre de la
    famille HARA
- symbole: $\alpha$
  ou: dss/descente-avec-inertie · dup/aversion-a-la-deception
  sens: >-
    collision avec l'autre cours : ici l'inertie, là l'intensité de la pénalité de
    déception
- symbole: $B$
  ou: dss/bagging · fpp/compte-capitalise
  sens: >-
    collision avec l'autre cours : ici le nombre d'arbres, là le compte capitalisé
    $B(t,T)$
- symbole: $\sigma^2$
  ou: dss/cp-de-mallows (slide 41) · dss/variance-d-une-moyenne-correlee (slide 109)
  sens: variance de l'erreur du modèle ; variance d'un arbre
