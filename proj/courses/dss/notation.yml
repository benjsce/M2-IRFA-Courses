collisions:
- symbole: $\lambda$
  ici: paramètre de pénalité de ridge et du lasso (slide 50)
  ailleurs:
    dss: taux d'apprentissage du boosting (slide 126), coût des poids de la décroissance
      (slide 174)
    dup: coefficient d'aversion aux pertes (L3 slide 39)
  note: >-
    trois emplois dans le même cours, que la source ne signale jamais, et un quatrième
    dans l'autre cours. Les trois valeurs typiques du cours diffèrent d'un ordre de grandeur
- symbole: $d$
  ici: nombre de prédicteurs (slide 41)
  ailleurs:
    dss: nombre de coupures par arbre (slide 126), signal d'erreur de la règle delta
      (slide 145)
  note: collision interne à la source
- symbole: $m$
  ici: prédicteurs tirés à chaque coupure (slide 113)
  ailleurs:
    dss: nombre d'exemples d'apprentissage (slide 168), indice de direction (slide 72)
  note: collision interne à la source
- symbole: $\sigma^2$
  ici: variance de l'erreur du modèle (slide 41)
  ailleurs:
    dss: variance d'un arbre (slide 109)
  note: collision interne à la source
- symbole: $\rho$
  ici: corrélation de paire entre deux arbres (slide 109)
  ailleurs:
    dup: aversion absolue au risque (L3 slide 40)
    fpp: sensibilité du prix au taux d'intérêt (§6.4)
  note: >-
    le même $\rho$ sert dans les trois cours. Aucun des trois ne le signale, chacun
    étant seul dans son poly
- symbole: $\eta$
  ici: taux d'apprentissage de la règle delta (slide 145)
  ailleurs:
    dup: paramètre de translation de la famille HARA (L2 slide 12)
- symbole: $\alpha$
  ici: coefficient d'inertie de la descente (slide 152)
  ailleurs:
    dup: coefficient linéaire de l'utilité quadratique (L1 slide 14)
- symbole: $B$
  ici: nombre d'échantillons bootstrap, nombre d'arbres (slide 97)
  ailleurs:
    fpp: compte capitalisé $B(t,T)$ — orthographe différente au registre, collision de
      lettre seulement
