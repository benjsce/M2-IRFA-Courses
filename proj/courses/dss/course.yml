code: dss
titre: Data Science Software
enseignant: Bertrand K. Hassani
annee: 2025-2026
sources:
- id: slides
  fichier: sources/2022_CombinedML.pdf
  type: slides (237 slides, jeu combiné ; daté 2022 par le nom de fichier)
# Une seule source : la référence est nue, sans préfixe de source (SPEC-MODELE §2.3).
# Le numéro est celui de la page du PDF, qui est aussi le numéro de slide — le deck ne
# porte pas de numérotation imprimée sauf sur les deux dernières sections.
refs_pattern: ^slide \d+$
depend_de: []
conventions_par_defaut:
  numerotation: >-
    le deck est un assemblage de plusieurs jeux (introduction, régression, arbres,
    réseaux de neurones, deux articles) ; il n'a ni sections numérotées ni définitions
    numérotées, donc la slide est la seule unité de référence
  langue_source: >-
    anglais ; les noms de fiches sont en français, le terme anglais est porté en alias
refonte_du_recit:
- date: '2026-09-26'
  raison: >-
    Parcours relus au test de lecture de SPEC-MODELE §8.6, à la demande de l'utilisateur :
    l'ordre des étapes suit désormais l'histoire, et non l'ordre du support, là où les deux
    divergeaient (détail au rapport du jour).
hors_parcours:
  dss/intelligence-artificielle: >-
    Le cours la nomme pour situer l'apprentissage automatique (un environnement ouvert, qui
    change) et n'en enseigne aucune méthode ; dans l'histoire de la banque, c'était un
    détour refermé aussitôt. L'étape « science des données » du premier parcours en dit
    l'objectif en une phrase.
  dss/apprentissage-non-supervise: >-
    Le cours le situe sans le développer ; dans l'histoire de la banque, un détour refermé
    aussitôt.
  dss/apprentissage-par-renforcement: >-
    Le cours s'arrête à son schéma ; dans l'histoire de la banque, un détour refermé
    aussitôt.
