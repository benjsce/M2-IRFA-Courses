<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 330" width="100%" height="auto" role="img" style="color:var(--fg);max-width:590px;height:auto"><title>Primal and dual give the same weights; invert the smaller matrix</title><rect x="20" y="50" width="150" height="150" fill="var(--ajo)" fill-opacity="0.85" rx="1.5"/><text x="95" y="125" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">(XᵀX + λIₚ)⁻¹</text><text x="95" y="220" text-anchor="middle" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">p × p : 8 TB</text><rect x="186" y="50" width="15" height="150" fill="var(--mut)" fill-opacity="0.85" rx="1.5"/><text x="193.5" y="42" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">Xᵀ</text><rect x="213" y="50" width="4" height="15" fill="var(--fg)" fill-opacity="0.85" rx="1.5"/><text x="215" y="42" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">y</text><text x="243" y="131" text-anchor="middle" font-size="22" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">=</text><text x="118.5" y="20" text-anchor="middle" font-size="13" fill="var(--mut)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">primal</text><rect x="283" y="50" width="15" height="150" fill="var(--mut)" fill-opacity="0.85" rx="1.5"/><text x="290.5" y="42" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">Xᵀ</text><rect x="310" y="50" width="15" height="15" fill="var(--acc)" fill-opacity="0.85" rx="1.5"/><text x="310" y="85" text-anchor="start" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">(XXᵀ + λIₙ)⁻¹</text><text x="310" y="105" text-anchor="start" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">n × n : 80 GB</text><rect x="337" y="50" width="4" height="15" fill="var(--fg)" fill-opacity="0.85" rx="1.5"/><text x="339" y="42" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">y</text><text x="312" y="20" text-anchor="middle" font-size="13" fill="var(--mut)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">dual</text><text x="417" y="131" text-anchor="middle" font-size="22" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">=</text><rect x="437" y="50" width="4" height="150" fill="var(--fg)" fill-opacity="0.85" rx="1.5"/><text x="439" y="42" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">ŵ</text><text x="449" y="125" text-anchor="start" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">p weights</text><text x="295" y="262" text-anchor="middle" font-size="14" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">ŵ = (XᵀX + λIₚ)⁻¹ Xᵀy = Xᵀ(XXᵀ + λIₙ)⁻¹ y</text><text x="295" y="286" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">same weights; with n = p / 10, invert the n × n matrix — though neither fits in a laptop's 16 GB</text></svg>
