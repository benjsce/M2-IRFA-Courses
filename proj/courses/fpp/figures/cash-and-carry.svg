<tspan dy="3.5" font-size="10.08">t</tspan><tspan dy="-3.5"></tspan></text><text x="171" y="742" text-anchor="start" font-size="12.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">placé</text><path d="M440 649 L440 563" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round"/><path d="M440 563 L436 571 L444 571 Z" fill="var(--acc)"/><text x="431" y="577" text-anchor="end" font-size="14" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">+ S<tspan dy="3.5" font-size="10.08">T</tspan><tspan dy="-3.5"></tspan></text><text x="431" y="596" text-anchor="end" font-size="12.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">action reçue</text><path d="M460 661 L460 747" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round"/><path d="M460 747 L464 739 L456 739 Z" fill="var(--acc)"/><text x="451" y="723" text-anchor="end" font-size="14" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">− K</text><text x="451" y="742" text-anchor="end" font-size="12.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">payé</text><path d="M500 661 L500 747" fill="none" stroke="var(--ajo)" stroke-width="2.2" stroke-linecap="round"/><path d="M500 747 L504 739 L496 739 Z" fill="var(--ajo)"/><text x="509" y="723" text-anchor="start" font-size="14" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">− S<tspan dy="3.5" font-size="10.08">T</tspan><tspan dy="-3.5"></tspan></text><text x="509" y="742" text-anchor="start" font-size="12.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">action rendue</text><path d="M520 649 L520 563" fill="none" stroke="var(--ajo)" stroke-width="2.2" stroke-linecap="round"/><path d="M520 563 L516 571 L524 571 Z" fill="var(--ajo)"/><text x="529" y="577" text-anchor="start" font-size="14" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-