<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 930" width="100%" height="auto" role="img" style="color:var(--fg);max-width:720px;height:auto"><title>Cash-and-carry et montage inverse : la somme des deux jambes en T est S_t / P(t,T) − K, sans S_T</title><text x="20" y="20" text-anchor="start" font-size="15.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Vendeur à terme : cash-and-carry</text><path d="M170 70 Q340 50 510 70" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-linecap="round"/><path d="M510 70 L502.52 65.09 L501.59 73.04 Z" fill="var(--mut)"/><text x="340" y="50" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">la dette grandit : ÷ P(t,T)</text><path d="M40 185 L680 185" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M679 185 L690 185" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round"/><path d="M690 185 L682 181 L682 189 Z" fill="var(--mut)"/><path d="M150 180 L150 190" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="209" text-anchor="middle" font-size="13" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M480 180 L480 190" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="209" text-anchor="middle" font-size="13" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">T</text><path d="M138 179 L138 93" fill="none" stroke="var(--ajo)" stroke-width="2.2" stroke-linecap="round"/><path d="M138 93 L134 101 L142 101 Z" fill="var(--ajo)"/><text x="129" y="107" text-anchor="end" font-size="14" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">+ S<tspan dy="3.5" font-size="10.08">t</tspan><tspan dy="-3.5"></tspan></text><text x="129" y="126" text-anchor="end"