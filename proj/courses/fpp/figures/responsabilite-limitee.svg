<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="100%" height="auto" role="img" style="color:var(--fg);max-width:560px;height:auto"><title>E = max(A − D, 0), et la faillite dès que les actifs perdent plus que E_t / A_t = 1 / l_t</title><path d="M54 16 L54 320 M54 190.52 L542 190.52" fill="none" stroke="var(--mut)" stroke-width="1.2"/><path d="M249.2 190.52 l0 4" stroke="var(--mut)" stroke-width="1.2"/><text x="249.2" y="207.52" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">D</text><path d="M346.8 190.52 l0 4" stroke="var(--mut)" stroke-width="1.2"/><text x="346.8" y="207.52" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">Aₜ</text><path d="M54 190.52 l-4 0" stroke="var(--mut)" stroke-width="1.2"/><text x="46" y="194.52" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">0</text><text x="542" y="223.52" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">actifs à l'échéance</text><text x="10" y="10" text-anchor="start" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">capitaux propres E</text><path d="M54 303.11 L249.2 190.52" fill="none" stroke="var(--li2)" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 190.52 L249.2 190.52 L542 21.63" fill="none" stroke="var(--acc)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><defs><filter id="fond-etiquette" x="-0.03" y="-0.12" width="1.06" height="1.24"><feFlood style="flood-color:var(--card)"/></filter></defs><text x="127.2" y="236.81" text-anchor="middle" font-size="12" fill="none" filter="url(#fond-etiquette)" font-family="ui-sans-serif,system-ui,sans-serif">sans la règle : A − D</text><text x="127.2" y="236.81" text-anchor="middle" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">sans la règle : A − D</text><text x="426.64" y="83.56" text-anchor="end" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">E = max(A − D, 0)</text><text x="151.6" y="181.52" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">plancher : E = 0</text><path d="M346.8 190.52 L346.8 134.22" fill="none" stroke="var(--li2)" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="346.8" cy="134.22" r="3.6" fill="var(--fg)"/><text x="354.8" y="138.22" text-anchor="start" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">E<tspan dy="3" font-size="8.64">t</tspan><tspan dy="-3"> = A</tspan><tspan dy="3" font-size="8.64">t</tspan><tspan dy="-3"> − D</tspan></text><path d="M249.2 274.96 L346.8 274.96 M249.2 276.96 l0 -4 M346.8 276.96 l0 -4" stroke="var(--ajo)" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="298" y="290.96" text-anchor="middle" font-size="12" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">une baisse de E<tspan dy="3" font-size="8.64">t</tspan><tspan dy="-3">, soit E</tspan><tspan dy="3" font-size="8.64">t</tspan><tspan dy="-3"> / A</tspan><tspan dy="3" font-size="8.64">t</tspan><tspan dy="-3"> = 1 / l</tspan><tspan dy="3" font-size="8.64">t</tspan><tspan dy="-3"> en relatif</tspan></text><text x="298" y="316" text-anchor="middle" font-size="13" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">faillite dès que π̃<tspan dy="3.25" font-size="9.36">A</tspan><tspan dy="-3.25"> ≤ −1 / l</tspan><tspan dy="3.25" font-size="9.36">t</tspan><tspan dy="-3.25"></tspan></text></svg>
