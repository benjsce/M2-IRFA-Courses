<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 330" width="100%" height="auto" role="img" style="color:var(--fg);max-width:728px;height:auto"><title>Call moins put de même strike : un achat à terme au prix du strike</title><g transform="translate(0 0)"><path d="M20 30 L20 250 M20 140 L212 140" fill="none" stroke="var(--mut)" stroke-width="1.2"/><path d="M116 140 l0 4" stroke="var(--mut)" stroke-width="1.2"/><text x="116" y="157" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">K</text><path d="M20 140 L116 140 L212 34.23" fill="none" stroke="var(--acc)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="18" text-anchor="middle" font-size="12" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">call (S<tspan dy="3" font-size="8.64">T</tspan><tspan dy="-3"> − K)</tspan><tspan dy="-4.2" font-size="8.64">+</tspan><tspan dy="4.2"></tspan></text><text x="116" y="272" text-anchor="middle" font-size="12" fill="var(--acc)" font-family="ui-sans-serif,system-ui,sans-serif">prix aujourd'hui : C</text></g><text x="237" y="172" text-anchor="middle" font-size="20" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">−</text><g transform="translate(254 0)"><path d="M20 30 L20 250 M20 140 L212 140" fill="none" stroke="var(--mut)" stroke-width="1.2"/><path d="M116 140 l0 4" stroke="var(--mut)" stroke-width="1.2"/><text x="116" y="157" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">K</text><path d="M20 34.23 L116 140 L212 140" fill="none" stroke="var(--ajo)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="18" text-anchor="middle" font-size="12" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">put (K − S<tspan dy="3" font-size="8.64">T</tspan><tspan dy="-3">)</tspan><tspan dy="-4.2" font-size="8.64">+</tspan><tspan dy="4.2"></tspan></text><text x="116" y="272" text-anchor="middle" font-size="12" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">prix aujourd'hui : P</text><text x="116" y="302" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">mêmes paiements, mêmes prix : C − P = S<tspan dy="3.12" font-size="9">0</tspan><tspan dy="-3.12"> − K P(0,T)</tspan></text></g><text x="491" y="172" text-anchor="middle" font-size="20" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">=</text><g transform="translate(508 0)"><path d="M20 30 L20 250 M20 140 L212 140" fill="none" stroke="var(--mut)" stroke-width="1.2"/><path d="M116 140 l0 4" stroke="var(--mut)" stroke-width="1.2"/><text x="116" y="157" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">K</text><path d="M20 245.77 L116 140 L212 34.23" fill="none" stroke="var(--fg)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="18" text-anchor="middle" font-size="12" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">achat à terme S<tspan dy="3" font-size="8.64">T</tspan><tspan dy="-3"> − K</tspan></text><text x="116" y="272" text-anchor="middle" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">prix : S<tspan dy="3" font-size="8.64">0</tspan><tspan dy="-3"> − K P(0,T)</tspan></text></g></svg>
