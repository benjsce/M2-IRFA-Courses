if,system-ui,sans-serif">même coût</text><text x="518.87" y="227.35" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">aujourd'hui (rien) :</text><text x="518.87" y="242.35" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">même paiement en T</text><text x="306.81" y="456.73" text-anchor="middle" font-size="14" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">F(t,T) = S<tspan dy="3.5" font-size="10.08">t</tspan><tspan dy="-3.5"> / P(t,T)</tspan></text><text x="306.81" y="476.73" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">la base F(t,T) − S<tspan dy="3.12" font-size="9">t</tspan><tspan dy="-3.12"> est l'intérêt de l'emprunt</tspan></text></svg>
