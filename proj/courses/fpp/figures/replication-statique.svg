<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="100%" height="auto" role="img" style="color:var(--fg);max-width:620px;height:auto"><title>Réplication statique, côté vendeur : tout est connu en t, sauf K</title><path d="M68.4 161.26 L593.88 161.26" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M593.28 161.26 L593.88 161.26" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round"/><path d="M593.88 161.26 L585.88 157.26 L585.88 165.26 Z" fill="var(--mut)"/><path d="M152.96 156.26 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="152.96" y="182.26" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M479.12 156.26 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="479.12" y="182.26" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">T</text><text x="23.1" y="22.95" text-anchor="start" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">le vendeur à terme : emprunter, acheter, porter, livrer</text><path d="M152.96 144.44 L152.96 79.02" fill="none" stroke="var(--ajo)" stroke-width="2" stroke-linecap="round"/><path d="M152.96 79.02 L148.96 87.02 L156.96 87.02 Z" fill="var(--ajo)"/><text x="161.96" y="103.32" text-anchor="start" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Sₜ emprunté</text><text x="161.96" y="123.88" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">connu</text><path d="M152.96 207.99 L152.96 273.4" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><path d="M152.96 273.4 L156.96 265.4 L148.96 265.4 Z" fill="var(--acc)"/><text x="161.96" y="234.15" text-anchor="start" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Sₜ : achat de l'action</text><text x="161.96" y="254.71" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">connu</text><path d="M479.12 144.44 L479.12 79.02" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M479.12 79.02 L475.12 87.02 L483.12 87.02 Z" fill="var(--fg)"/><text x="470.12" y="103.32" text-anchor="end" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">K, contre l'action</text><text x="470.12" y="123.88" text-anchor="end" font-size="11.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">cherché</text><path d="M479.12 207.99 L479.12 273.4" fill="none" stroke="var(--ajo)" stroke-width="2" stroke-linecap="round"/><path d="M479.12 273.4 L483.12 265.4 L475.12 265.4 Z" fill="var(--ajo)"/><text x="470.12" y="234.15" text-anchor="end" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Sₜ / P(t,T) : remboursement</text><text x="470.12" y="254.71" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">connu dès t</text><path d="M165.04 301.44 L467.04 301.44" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><text x="316.04" y="305.44" text-anchor="middle" font-size="11.5" stroke="var(--card)" stroke-width="3.2" stroke-linejoin="round" fill="none" font-family="ui-sans-serif,system-ui,sans-serif">l'action est portée, sans aucun geste</text><text x="316.04" y="305.44" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">l'action est portée, sans aucun geste</text><text x="152.96" y="58.46" text-anchor="middle" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">solde : 0</text><text x="479.12" y="58.46" text-anchor="middle" font-size="12" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">solde : K − Sₜ / P(t,T), sans S<tspan dy="3" font-size="8.64">T</tspan><tspan dy="-3">, donc nul</tspan></text></svg>
