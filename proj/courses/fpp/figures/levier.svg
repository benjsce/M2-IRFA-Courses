<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="auto" role="img" style="color:var(--fg);max-width:540px;height:auto"><title>La dette ne bouge pas : toute la perte de l'actif tombe sur les capitaux propres</title><g transform="translate(0 0)"><rect x="41.75" y="66.61" width="74" height="203.39" fill="var(--mut)" fill-opacity="0.45" rx="1.5"/><text x="78.75" y="168.31" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">actif 100</text><rect x="134.25" y="127.63" width="74" height="142.37" fill="var(--mut)" fill-opacity="0.25" rx="1.5"/><rect x="134.25" y="66.61" width="74" height="61.02" fill="var(--acc)" fill-opacity="0.75" rx="1.5"/><text x="171.25" y="198.81" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">dette 70</text><text x="171.25" y="101.12" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">E = 30</text><path d="M32.5 270 L217.5 270" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="20" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">avant</text><text x="125" y="290" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">l = 100 / 30 = 3,33</text></g><text x="270" y="157" text-anchor="middle" font-size="20" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">→</text><g transform="translate(290 0)"><rect x="41.75" y="86.95" width="74" height="183.05" fill="var(--mut)" fill-opacity="0.45" rx="1.5"/><text x="78.75" y="178.47" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">actif 90</text><rect x="134.25" y="127.63" width="74" height="142.37" fill="var(--mut)" fill-opacity="0.25" rx="1.5"/><rect x="134.25" y="86.95" width="74" height="40.68" fill="var(--acc)" fill-opacity="0.75" rx="1.5"/><text x="171.25" y="198.81" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">dette 70</text><text x="171.25" y="111.29" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">E = 20</text><path d="M32.5 270 L217.5 270" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="20" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">l'actif perd 10 %</text><text x="125" y="290" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">E : −33 % = 3,33 × (−10 %)</text></g></svg>
