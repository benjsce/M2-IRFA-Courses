<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color:var(--fg);max-width:600px;height:auto"><title>P(t,T) = P(t,S)·e^{K(S−T)} : le FRA ne coûte rien, K est le taux forward</title><path d="M68.73 200 L567.97 200" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M566.51 200 L567.97 200" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round"/><path d="M567.97 200 L559.97 196 L559.97 204 Z" fill="var(--mut)"/><path d="M156.84 195 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="156.84" y="221" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M303.67 195 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="303.67" y="221" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">T</text><path d="M450.51 195 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="450.51" y="221" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">S</text><path d="M450.51 190.5 L450.51 105" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M450.51 105 L446.51 113 L454.51 113 Z" fill="var(--acc)"/><text x="460.51" y="124" text-anchor="start" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.38" font-size="9">R(T,S)(S−T)</tspan><tspan dy="4.38"></tspan></text><text x="460.51" y="150.6" text-anchor="start" font-size="12" fill="var(--acc)" font-family="ui-sans-serif,system-ui,sans-serif">inconnu aujourd'hui</text><path d="M443.16 90.75 Q377.82 62.75 312.48 90.75" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M312.48 90.75 L321.41 91.28 L318.26 83.92 Z" fill="var(--acc)"/><circle cx="303.67" cy="90.75" r="3.6" fill="var(--acc)"/><text x="295.67" y="86.75" text-anchor="end" font-size="12" fill="var(--acc)" font-family="ui-sans-serif,system-ui,sans-serif">vaut 1 en T,</text><text x="295.67" y="101.75" text-anchor="end" font-size="12" fill="var(--acc)" font-family="ui-sans-serif,system-ui,sans-serif">quel que soit R(T,S)</text><path d="M296.33 46.1 Q259.62 26.1 222.91 46.1" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-linecap="round"/><path d="M222.91 46.1 L231.85 45.79 L228.02 38.76 Z" fill="var(--acc)"/><text x="156.84" y="50.1" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">P(t,T)</text><path d="M450.51 239.9 L450.51 318.75" fill="none" stroke="var(--ajo)" stroke-width="2.2" stroke-linecap="round"/><path d="M450.51 318.75 L454.51 310.75 L446.51 310.75 Z" fill="var(--ajo)"/><text x="460.51" y="266.5" text-anchor="start" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.38" font-size="9">K(S−T)</tspan><tspan dy="4.38"></tspan></text><text x="460.51" y="293.1" text-anchor="start" font-size="12" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">fixé aujourd'hui</text><path d="M450.51 337.75 Q351.39 381.75 252.28 337.75" fill="none" stroke="var(--ajo)" stroke-width="1.5" stroke-linecap="round"/><path d="M252.28 337.75 L257.97 344.65 L261.21 337.34 Z" fill="var(--ajo)"/><text x="156.84" y="341.75" text-anchor="middle" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">P(t,S)·e<tspan dy="-4.38" font-size="9">K(S−T)</tspan><tspan dy="4.38"></tspan></text><path d="M156.84 65.1 L156.84 171.5" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M156.84 242.75 L156.84 315.9" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="148.84" y="107.75" text-anchor="end" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">égales :</text><text x="148.84" y="123.75" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">le contrat</text><text x="148.84" y="138.75" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">ne coûte rien</text><text x="148.84" y="280.75" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">0,9608 = 0,9048·e<tspan dy="-4.2" font-size="8.64">K</tspan><tspan dy="4.2"></tspan></text><text x="303.67" y="380.5" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">K = F(t,T,S) = ln(0,9608 / 0,9048) = 6 %</text></svg>
