<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="100%" height="auto" role="img" style="color:var(--fg);max-width:680px;height:auto"><title>Placer 1 de t à S en une fois ou en deux temps : même résultat, d'où le taux forward K</title><path d="M37.12 231.44 L507.26 231.44" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.45 231.44 L507.26 231.44" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round"/><path d="M507.26 231.44 L499.26 227.44 L499.26 235.44 Z" fill="var(--mut)"/><path d="M91.37 226.44 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="91.37" y="252.44" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M272.19 226.44 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="272.19" y="252.44" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">T</text><path d="M453.01 226.44 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="453.01" y="252.44" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">S</text><circle cx="91.37" cy="127.79" r="4" fill="var(--acc)"/><text x="91.37" y="117.79" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">1</text><circle cx="453.01" cy="127.79" r="4" fill="var(--acc)"/><text x="453.01" y="151.79" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.38" font-size="9">R(t,S)(S−t)</tspan><tspan dy="4.38"></tspan></text><path d="M102.22 120.25 Q272.19 60.25 442.16 120.25" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><path d="M442.16 120.25 L435.95 113.82 L433.29 121.36 Z" fill="var(--acc)"/><text x="272.19" y="54.25" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">① en une fois, au taux R(t,S) :</text><text x="272.19" y="72.25" text-anchor="middle" font-size="12.5" fill="var(--acc)" font-family="ui-sans-serif,system-ui,sans-serif">× e<tspan dy="-4.38" font-size="9">R(t,S)(S−t)</tspan><tspan dy="4.38"></tspan></text><circle cx="91.37" cy="344.52" r="4" fill="var(--ajo)"/><text x="91.37" y="334.52" text-anchor="middle" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">1</text><circle cx="272.19" cy="344.52" r="4" fill="var(--ajo)"/><text x="272.19" y="334.52" text-anchor="middle" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.38" font-size="9">R(t,T)(T−t)</tspan><tspan dy="4.38"></tspan></text><circle cx="453.01" cy="344.52" r="4" fill="var(--ajo)"/><text x="453.01" y="334.52" text-anchor="middle" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.38" font-size="9">R(t,T)(T−t)</tspan><tspan dy="4.38"> · e</tspan><tspan dy="-4.38" font-size="9">K(S−T)</tspan><tspan dy="4.38"></tspan></text><path d="M102.22 353.94 Q181.78 397.94 261.34 353.94" fill="none" stroke="var(--ajo)" stroke-width="2" stroke-linecap="round"/><path d="M261.34 353.94 L252.41 354.31 L256.28 361.31 Z" fill="var(--ajo)"/><path d="M283.04 353.94 Q362.6 397.94 442.16 353.94" fill="none" stroke="var(--ajo)" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/><path d="M442.16 353.94 L433.23 354.31 L437.1 361.31 Z" fill="var(--ajo)"/><text x="181.78" y="415.94" text-anchor="middle" font-size="12" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">② jusqu'à T, au taux R(t,T) :</text><text x="181.78" y="432.94" text-anchor="middle" font-size="12" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">× e<tspan dy="-4.2" font-size="8.64">R(t,T)(T−t)</tspan><tspan dy="4.2"></tspan></text><text x="362.6" y="415.94" text-anchor="middle" font-size="12" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">puis de T à S, au taux K fixé</text><text x="362.6" y="432.94" text-anchor="middle" font-size="12" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">aujourd'hui par le FRA : × e<tspan dy="-4.2" font-size="8.64">K(S−T)</tspan><tspan dy="4.2"></tspan></text><path d="M552.47 137.21 L552.47 335.1" fill="none" stroke="var(--fg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="560.47" y="198.46" text-anchor="start" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">③ égaux :</text><text x="560.47" y="214.46" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">connus tous deux</text><text x="560.47" y="229.46" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">aujourd'hui, sinon</text><text x="560.47" y="244.46" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">arbitrage</text><text x="290.27" y="467.02" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">les exposants s'ajoutent : R(t,T)(T − t) + K(S − T) = R(t,S)(S − t)</text><text x="290.27" y="488.02" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">d'où K = F(t,T,S) = [R(t,S)(S − t) − R(t,T)(T − t)] / (S − T)</text></svg>
