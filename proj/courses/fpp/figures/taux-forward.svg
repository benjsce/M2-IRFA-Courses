<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="auto" role="img" style="color:var(--fg);max-width:640px;height:auto"><title>Le taux forward bouche le trou : les deux lignes doivent rapporter autant</title><path d="M31.55 310.93 L614.34 310.93" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M613.75 310.93 L614.34 310.93" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round"/><path d="M614.34 310.93 L606.34 306.93 L606.34 314.93 Z" fill="var(--mut)"/><path d="M66.87 305.93 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="66.87" y="331.93" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M267.02 305.93 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="267.02" y="331.93" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">T</text><path d="M467.17 305.93 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="467.17" y="331.93" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">S</text><rect x="66.87" y="64.44" width="400.3" height="87.32" fill="var(--ajo)" fill-opacity="0.16" rx="1.5"/><path d="M66.87 151.76 L467.17 151.76 L467.17 64.44 L66.87 64.44 L66.87 151.76" fill="none" stroke="var(--ajo)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="66.87" y="46.47" text-anchor="start" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">placer d'un coup, de t à S</text><text x="267.02" y="102.99" text-anchor="middle" font-size="13" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">5 % par an pendant 2 ans</text><text x="267.02" y="133.79" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">connu aujourd'hui</text><text x="481.89" y="119.93" text-anchor="start" font-size="14" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">= 10 %</text><rect x="66.87" y="223.15" width="200.15" height="69.81" fill="var(--acc)" fill-opacity="0.16" rx="1.5"/><path d="M66.87 292.96 L267.02 292.96 L267.02 223.15 L66.87 223.15 L66.87 292.96" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M267.02 292.96 L467.17 292.96 L467.17 188.12 L267.02 188.12 L267.02 292.96" fill="none" stroke="var(--fg)" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><text x="66.87" y="172.72" text-anchor="start" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">placer jusqu'en T, puis replacer jusqu'en S</text><text x="166.94" y="255.99" text-anchor="middle" font-size="13" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">4 % pendant 1 an</text><text x="166.94" y="281.66" text-anchor="middle" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">connu aujourd'hui</text><text x="367.09" y="230.32" text-anchor="middle" font-size="13" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">le trou : F pendant 1 an</text><text x="367.09" y="261.12" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">F = 10 % − 4 % = 6 %</text><text x="481.89" y="261.12" text-anchor="start" font-size="14" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">= 4 % + F</text><text x="481.89" y="195.4" text-anchor="start" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">égaux</text><path d="M499.55 133.79 L499.55 180" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.5