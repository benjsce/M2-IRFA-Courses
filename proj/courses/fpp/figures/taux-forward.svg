<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="100%" height="auto" role="img" style="color:var(--fg);max-width:660px;height:auto"><title>Taux forward : chaque jambe du FRA ramenée en t, puis égalées parce que le contrat est gratuit</title><path d="M188.6 235 L627.67 235" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M626.19 235 L627.67 235" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round"/><path d="M627.67 235 L619.67 231 L619.67 239 Z" fill="var(--mut)"/><path d="M196.05 230 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="196.05" y="256" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M344.88 230 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="344.88" y="256" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">T = t + 1</text><path d="M493.72 230 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="493.72" y="256" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">S = t + 2</text><text x="17.44" y="60.51" text-anchor="start" font-size="12" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">on reçoit</text><text x="17.44" y="414.08" text-anchor="start" font-size="12" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">on paie</text><path d="M344.88 223.98 L344.88 156.94" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round"/><path d="M344.88 156.94 L340.88 164.94 L348.88 164.94 Z" fill="var(--acc)"/><text x="352.88" y="193.67" text-anchor="start" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">1</text><path d="M353.81 147.76 Q420.79 123.76 487.77 147.76" fill="none" stroke="var(--acc)" stroke-width="1.4" stroke-linecap="round"/><path d="M487.77 147.76 L481.59 141.29 L478.89 148.82 Z" fill="var(--acc)"/><path d="M493.72 223.98 L493.72 156.94" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M493.72 156.94 L489.72 164.94 L497.72 164.94 Z" fill="var(--acc)"/><text x="501.72" y="178.06" text-anchor="start" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.38" font-size="9">R(T,S)(S−T)</tspan><tspan dy="4.38"></tspan></text><text x="501.72" y="194.06" text-anchor="start" font-size="11.5" fill="var(--acc)" font-family="ui-sans-serif,system-ui,sans-serif">inconnu aujourd'hui</text><text x="419.3" y="117.76" text-anchor="middle" font-size="12" fill="var(--acc)" font-family="ui-sans-serif,system-ui,sans-serif">① 1 placé de T à S au taux du moment</text><text x="419.3" y="132.76" text-anchor="middle" font-size="12" fill="var(--acc)" font-family="ui-sans-serif,system-ui,sans-serif">donne exactement ce montant</text><path d="M337.44 138.57 Q293.79 66.87 213.91 92.65" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linecap="round"/><path d="M213.91 92.65 L222.75 94 L220.29 86.39 Z" fill="var(--acc)"/><text x="277.91" y="66.65" text-anchor="middle" font-size="12" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">② × P(t,T)</text><text x="188.05" y="97.65" text-anchor="end" font-size="12.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">0,9608</text><path d="M493.72 276.33 L493.72 340.61" fill="none" stroke="var(--ajo)" stroke-width="2.2" stroke-linecap="round"/><path d="M493.72 340.61 L497.72 332.61 L489.72 332.61 Z" fill="var(--ajo)"/><text x="501.72" y="303.88" text-anchor="start" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.38" font-size="9">K(S−T)</tspan><tspan dy="4.38"></tspan></text><text x="501.72" y="319.88" text-anchor="start" font-size="11.5" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">fixé aujourd'hui</text><path d="M486.28 354.39 Q355.13 425.66 213.91 377.35" fill="none" stroke="var(--ajo)" stroke-width="1.8" stroke-linecap="round"/><path d="M213.91 377.35 L220.18 383.72 L222.77 376.15 Z" fill="var(--ajo)"/><text x="374.65" y="368.16" text-anchor="middle" font-size="12" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">② × P(t,S)</text><text x="188.05" y="382.35" text-anchor="end" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">0,9048 × e<tspan dy="-4.38" font-size="9">K</tspan><tspan dy="4.38"></tspan></text><path d="M136.51 115.61 L136.51 198.27" fill="none" stroke="var(--fg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M136.51 276.33 L136.51 354.39" fill="none" stroke="var(--fg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="136.51" y="232" text-anchor="middle" font-size="13" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">③ égales :</text><text x="136.51" y="248" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">le contrat est gratuit</text><text x="322.56" y="448.98" text-anchor="middle" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">0,9608 = 0,9048 × e<tspan dy="-4.38" font-size="9">K</tspan><tspan dy="4.38">, d'où K = F(t,T,S) = ln(0,9608 / 0,9048) = 6 %</tspan></text></svg>
