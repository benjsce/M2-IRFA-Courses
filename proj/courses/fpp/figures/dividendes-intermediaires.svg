 x="70" y="440" text-anchor="start" font-size="13.5" fill="var(--fg)" font-family="ui-sans-serif,system-ui,sans-serif">action portée à crédit, emprunt long : + (S<tspan dy="3.38" font-size="9.72">T</tspan><tspan dy="-3.38"> − (1 − d₁) S</tspan><tspan dy="3.38" font-size="9.72">t</tspan><tspan dy="-3.38"> / P(t,T))</tspan></text><text x="480" y="477" text-anchor="middle" font-size="15" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">somme en T : F − (1 − d₁) S<tspan dy="3.75" font-size="10.8">t</tspan><tspan dy="-3.75"> / P(t,T)</tspan></text><text x="480" y="505" text-anchor="middle" font-size="13" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">certaine et sans mise, donc nulle → F(t,T) = S<tspan dy="3.25" font-size="9.36">t</tspan><tspan dy="-3.25"> / P(t,T) × (1 − d₁)</tspan></text></svg>
