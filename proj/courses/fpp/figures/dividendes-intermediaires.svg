<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="auto" role="img" style="color:var(--fg);max-width:960px;height:auto"><title>Avec un dividende, le vendeur à terme n'emprunte jusqu'à T que (1 − d₁) S_t : F = S_t / P(t,T) × (1 − d₁)</title><text x="20" y="24" text-anchor="start" font-size="15.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Vendeur à terme : cash-and-carry avec un dividende en T₁</text><path d="M195 118 Q295 102 395 118" fill="none" stroke="var(--fg)" stroke-width="1.2" stroke-linecap="round"/><path d="M395 118 L387.73 112.79 L386.47 120.69 Z" fill="var(--fg)"/><text x="295" y="96" text-anchor="middle" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">emprunt court : ÷ P(t,T₁)</text><path d="M195 72 Q462.5 52 730 72" fill="none" stroke="var(--ajo)" stroke-width="1.2" stroke-linecap="round"/><path d="M730 72 L722.32 67.41 L721.72 75.39 Z" fill="var(--ajo)"/><text x="455" y="50" text-anchor="middle" font-size="12" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">emprunt long : ÷ P(t,T)</text><path d="M40 245 L930 245" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M929 245 L940 245" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round"/><path d="M940 245 L932 241 L932 249 Z" fill="var(--mut)"/><path d="M190 240 L190 250" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="269" text-anchor="middle" font-size="13" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M420 240 L420 250" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="269" text-anchor="middle" font-size="13" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">T₁</text><path d="M700 240 L700 250" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="269" text-anchor="middle" font-size="13" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">T</text><path d="M164 239 L164 153" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linecap="round"/><path d="M164 153 L160 161 L168 161 Z" fill="var(--fg)"/><text x="155" y="167" text-anchor="end" font-size="13.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">+ d₁ S<tspan dy="3.38" font-size="9.72">t</tspan><tspan dy="-3.38"></tspan></text><text x="155" y="186" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">emprunté jusqu'à T₁</text><path d="M182 239 L182 153" fill="none" stroke="var(--ajo)" stroke-width="2.2" stroke-linecap="round"/><path d="M182 153 L178 161 L186 161 Z" fill="var(--ajo)"/><text x="173" y="167" text-anchor="end" font-size="13.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif"></text><text x="173" y="186" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif"></text><text x="155" y="127" text-anchor="end" font-size="13.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">+ (1 − d₁) S<tspan dy="3.38" font-size="9.72">t</tspan><tspan dy="-3.38"></tspan></text><text x="155" y="146" text-anchor="end" font-size="12" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">emprunté jusqu'à T</text><path d="M202 251 L202 337" fill="none" stroke="var(--ajo)" stroke-width="2.2" stroke-linecap="round"/><path d="M202 337 L206 329 L198 329 Z" fill="var(--ajo)"/><text x="211" y="313" text-anchor="start" font-size="13.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">− S<tspan dy="3.38" font-size="9.72">t</tspan><tspan dy="-3.38"></tspan></text><text x="211" y="332" text-anchor="start" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">achat de l'action</text><path d="M410 239 L410 153" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linecap="round"/><path d="M410 153 L406 161 L414 161 Z" fill="var(--fg)"/><text x="401" y="167" text-anchor="end" font-size="13.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">+ d₁ S<tspan dy="3.38" font-size="9.72">t</tspan><tspan dy="-3.38"> / P(t,T₁)</tspan></text><text x="401" y="186" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">dividende reçu</text><path d="M430 251 L430 337" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linecap="round"/><path d="M430 337 L434 329 L426 329 Z" fill="var(--fg)"/><text x="439" y="313" text-anchor="start" font-size="13.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">− d₁ S<tspan dy="3.38" font-size="9.72">t</tspan><tspan dy="-3.38"> / P(t,T₁)</tspan></text><text x="439" y="332" text-anchor="start" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">emprunt court remboursé</text><path d="M660 251 L660 337" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round"/><path d="M660 337 L664 329 L656 329 Z" fill="var(--acc)"/><text x="651" y="313" text-anchor="end" font-size="13.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">− S<tspan dy="3.38" font-size="9.72">T</tspan><tspan dy="-3.38"></tspan></text><text x="651" y="332" text-anchor="end" font-size="12" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">action livrée</text><path d="M680 239 L680 153" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round"/><path d="M680 153 L676 161 L684 161 Z" fill="var(--acc)"/><text x="671" y="167" text-anchor="end" font-size="13.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">+ F</t