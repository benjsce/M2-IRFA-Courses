<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="auto" role="img" style="color:var(--fg);max-width:700px;height:auto"><title>FRA : la jambe flottante a un montant inconnu, mais elle vaut 1 en T, donc P(t,T) aujourd'hui</title><path d="M32 192.3 L674 192.3" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M673.4 192.3 L674 192.3" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-linecap="round"/><path d="M674 192.3 L666 188.3 L666 196.3 Z" fill="var(--mut)"/><path d="M182 187.3 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="182" y="213.3" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">t</text><path d="M368 187.3 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="368" y="213.3" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">T</text><path d="M554 187.3 l0 10" stroke="var(--mut)" stroke-width="1.3"/><text x="554" y="213.3" text-anchor="middle" font-size="12.5" fill="var(--mut)" font-style="italic" font-family="ui-sans-serif,system-ui,sans-serif">S</text><path d="M554 176.18 L554 95.54" fill="none" stroke="var(--ajo)" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M554 95.54 L550 103.54 L558 103.54 Z" fill="var(--ajo)"/><text x="564" y="125.49" text-anchor="start" font-size="13.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.72" font-size="9.72">R(T,S)(S−T)</tspan><tspan dy="4.72"></tspan></text><text x="564" y="153.14" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">inconnu aujourd'hui</text><path d="M548 77.11 Q461 49.11 374 77.11" fill="none" stroke="var(--ajo)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M374 77.11 L382.84 78.47 L380.39 70.86 Z" fill="var(--ajo)"/><circle cx="368" cy="77.11" r="3.6" fill="var(--ajo)"/><text x="359" y="73.11" text-anchor="end" font-size="12.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">vaut 1 en T,</text><text x="359" y="89.11" text-anchor="end" font-size="11.5" fill="var(--ajo)" font-family="ui-sans-serif,system-ui,sans-serif">quel que soit R(T,S)</text><path d="M362 40.25 Q275 16.25 188 40.25" fill="none" stroke="var(--ajo)" stroke-width="1.5" stroke-linecap="round"/><path d="M188 40.25 L196.78 41.98 L194.65 34.27 Z" fill="var(--ajo)"/><text x="176" y="44.25" text-anchor="end" font-size="13.5" fill="var(--ajo)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">P(t,T)</text><path d="M554 226.86 L554 298.28" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round"/><path d="M554 298.28 L558 290.28 L550 290.28 Z" fill="var(--acc)"/><text x="564" y="259.11" text-anchor="start" font-size="13.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">e<tspan dy="-4.72" font-size="9.72">K(S−T)</tspan><tspan dy="4.72"></tspan></text><text x="564" y="286.76" text-anchor="start" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">fixé aujourd'hui</text><path d="M548 323.62 Q368 359.62 188 323.62" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-linecap="round"/><path d="M188 323.62 L195.06 329.11 L196.63 321.27 Z" fill="var(--acc)"/><text x="176" y="327.62" text-anchor="end" font-size="13.5" fill="var(--acc)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">P(t,S)·e<tspan dy="-4.72" font-size="9.72">K(S−T)</tspan><tspan dy="4.72"></tspan></text><text x="167" y="130.1" text-anchor="end" font-size="12.5" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">égales :</text><text x="167" y="153.14" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">le contrat</text><text x="167" y="238.38" text-anchor="end" font-size="13" fill="var(--fg)" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">K = F(t,T,S)</text><path d="M122 58.68 L122 111.67" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 259.11 L122 305.19" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="167" y="176.18" text-anchor="end" font-size="11.5" fill="var(--mut)" font-family="ui-sans-serif,system-ui,sans-serif">ne coûte rien</text></svg>
