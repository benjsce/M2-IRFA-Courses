symboles:
- symbole: $B(t,T)$
  notion: fpp/compte-capitalise
  ref: §4.2.2
  sens: compte capitalisé (bank account) entre t et T
- symbole: $P(t,T)$
  notion: fpp/facteur-actualisation
  ref: Déf. 3
  sens: prix en t d’un flux de 1 payé en T (zéro-coupon)
- symbole: $F(t,T)$
  notion: fpp/forward-action
  ref: Déf. 8
  sens: prix forward de maturité T
- symbole: FRA
  notion: fpp/fra
  ref: Déf. 7
  sens: Forward Rate Agreement
- symbole: $\mathbb{Q}$
  notion: fpp/mesure-risque-neutre
  ref: §5.1
  sens: probabilité risque-neutre
- symbole: $\Phi$
  notion: fpp/portage
  sens: facteur de portage du sous-jacent
  ajout: true
- symbole: $F$
  notion: fpp/prix-a-terme
  ref: Déf. 8
  sens: valeur forward / prix forward
- symbole: $K$
  notion: fpp/prix-a-terme
  ref: §2.3
  sens: 'strike : prix ou taux fixé dans le contrat'
- symbole: $H$
  notion: fpp/prix-a-terme
  ref: §4.2
  sens: prix future
- symbole: $H_t$
  notion: fpp/prix-future
  ref: §4.2
  sens: prix future en t
- symbole: $X_t$
  notion: fpp/taux-de-change
  ref: §2.4
  sens: unités de devise étrangère pour 1 unité locale
- symbole: $F(t,T,S)$
  notion: fpp/taux-forward
  ref: §2.3
  sens: taux forward continûment composé entre T et S
- symbole: $f(t,T)$
  notion: fpp/taux-forward
  ref: §2.3
  sens: taux forward instantané
- symbole: $R(t,T)$
  notion: fpp/taux-zero-coupon
  ref: §2.3
  sens: taux zéro-coupon continûment composé
- symbole: $L(t,S)$
  notion: fpp/taux-zero-coupon
  ref: §2.3
  sens: taux linéaire (court terme)
- symbole: $\mathrm{NPV}$
  notion: fpp/valeur-actuelle-nette
  ref: Déf. 4
  sens: valeur actuelle nette
- symbole: $S_t$
  notion: fpp/forward-action
  ref: §3.1
  sens: prix comptant du sous-jacent
- symbole: $D$
  notion: fpp/prix-a-terme
  sens: facteur d’actualisation du strike (emplacement générique)
  ajout: true
- symbole: $\tau$
  notion: fpp/facteur-actualisation
  ref: §3.1
  sens: durée T−t
- symbole: $\pi$
  notion: fpp/absence-arbitrage
  ref: §1.3
  sens: prime de risque
- symbole: $d_i$
  notion: fpp/portage
  ref: §3.2
  sens: taux de dividende proportionnel à la date T_i
- symbole: $q$
  notion: fpp/portage
  ref: §6.4
  sens: rendement continu de dividende (noté d au §5.2)
- symbole: $P^f(t,T)$
  notion: fpp/forward-de-change
  ref: §2.4
  sens: zéro-coupon en devise étrangère
collisions:
- symbole: $P$
  ici: zéro-coupon P(t,T)
  ailleurs:
    cs: probabilité historique
- symbole: $F$
  ici: prix forward
  ailleurs:
    cs: filtration F_t
- symbole: $d$
  ici: rendement continu de dividende (§5.2)
  ailleurs:
    fpp: d_1, d_2 de Black–Scholes (§6.4)
