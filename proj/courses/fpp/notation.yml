symboles:
- symbole: $B(t,T)$
  notion: fpp/compte-capitalise
  ref: §4.2.2
  sens: compte capitalisé (bank account) entre t et T
- symbole: $P(t,T)$
  notion: fpp/facteur-actualisation
  ref: Déf. 3
  sens: prix en t d’un flux de 1 payé en T (zéro-coupon)
- symbole: $F(t,T)$
  notion: fpp/forward-action
  ref: Déf. 8
  sens: prix forward de maturité T
- symbole: FRA
  notion: fpp/fra
  ref: Déf. 7
  sens: Forward Rate Agreement
- symbole: $\mathbb{Q}$
  notion: fpp/mesure-risque-neutre
  ref: §5.1
  sens: probabilité risque-neutre
- symbole: $\Phi$
  notion: fpp/portage
  sens: facteur de portage du sous-jacent
  ajout: true
- symbole: $F$
  notion: fpp/prix-a-terme
  ref: Déf. 8
  sens: valeur forward / prix forward
- symbole: $K$
  notion: fpp/prix-a-terme
  ref: §2.3
  sens: 'strike : prix ou taux fixé dans le contrat'
- symbole: $H$
  notion: fpp/prix-a-terme
  ref: §4.2
  sens: prix future
- symbole: $H_t$
  notion: fpp/prix-future
  ref: §4.2
  sens: prix future en t
- symbole: $X_t$
  notion: fpp/taux-de-change
  ref: §2.4
  sens: unités de devise étrangère pour 1 unité locale
- symbole: $F(t,T,S)$
  notion: fpp/taux-forward
  ref: §2.3
  sens: taux forward continûment composé entre T et S
- symbole: $f(t,T)$
  notion: fpp/taux-forward
  ref: §2.3
  sens: taux forward instantané
- symbole: $R(t,T)$
  notion: fpp/taux-zero-coupon
  ref: §2.3
  sens: taux zéro-coupon continûment composé
- symbole: $L(t,S)$
  notion: fpp/taux-zero-coupon
  ref: §2.3
  sens: taux linéaire (court terme)
- symbole: $\mathrm{NPV}$
  notion: fpp/valeur-actuelle-nette
  ref: Déf. 4
  sens: valeur actuelle nette
- symbole: $S_t$
  notion: fpp/forward-action
  ref: §3.1
  sens: prix comptant du sous-jacent
- symbole: $D$
  notion: fpp/prix-a-terme
  sens: facteur d’actualisation du strike (emplacement générique)
  ajout: true
- symbole: $\tau$
  notion: fpp/facteur-actualisation
  ref: §3.1
  sens: durée T−t
- symbole: $\pi$
  notion: fpp/absence-arbitrage
  ref: §1.3
  sens: prime de risque
- symbole: $d_i$
  notion: fpp/portage
  ref: §3.2
  sens: taux de dividende proportionnel à la date T_i
- symbole: $q$
  notion: fpp/portage
  ref: §6.4
  sens: rendement continu de dividende (noté d au §5.2)
- symbole: $P^f(t,T)$
  notion: fpp/forward-de-change
  ref: §2.4
  sens: zéro-coupon en devise étrangère
- symbole: $A_t$
  notion: fpp/bilan
  ref: §1.3
  sens: niveau de l'actif en t
- symbole: $E_t$
  notion: fpp/bilan
  ref: §1.3
  sens: niveau des capitaux propres en t
- symbole: $D_t$
  notion: fpp/bilan
  ref: §1.3
  sens: niveau de la dette en t
- symbole: $l_t$
  notion: fpp/levier
  ref: Déf. 1
  sens: levier, rapport de l'actif aux capitaux propres
- symbole: $\pi_A$
  notion: fpp/prime-de-risque
  ref: Déf. 2
  sens: prime de risque de l'actif
- symbole: $\pi_E$
  notion: fpp/prime-de-risque
  ref: Déf. 2
  sens: prime de risque des capitaux propres
- symbole: $\sigma$
  notion: fpp/volatilite
  ref: Déf. 2
  sens: volatilité, écart type du rendement
- symbole: $\sigma_A$
  notion: fpp/volatilite
  ref: §1.3
  sens: volatilité de l'actif
- symbole: $\mu$
  notion: fpp/modele-black-scholes
  ref: §5.4
  sens: dérive du sous-jacent sous la probabilité historique
- symbole: $W_t$
  notion: fpp/modele-black-scholes
  ref: §5.4
  sens: mouvement brownien
- symbole: $C$
  notion: fpp/call
  ref: §6.4
  sens: prix d'un call
- symbole: $P$
  notion: fpp/put
  ref: §6.4
  sens: "prix d'un put — voir la collision : $P$ est aussi le zéro-coupon $P(t,T)$"
- symbole: $G$
  notion: fpp/payoff
  ref: Déf. 11
  sens: fonction de payoff
- symbole: $\mathrm{IV}$
  notion: fpp/valeur-intrinseque
  ref: Déf. 12
  sens: valeur intrinsèque d'un payoff
- symbole: $\mathrm{TV}$
  notion: fpp/valeur-temps
  ref: Déf. 13
  sens: valeur temps d'un payoff
- symbole: $N(\cdot)$
  notion: fpp/formule-black-scholes
  ref: §6.4
  sens: fonction de répartition de la loi normale centrée réduite
- symbole: $d_1$
  notion: fpp/formule-black-scholes
  ref: §6.4
  sens: premier argument de la normale dans la formule de Black et Scholes
- symbole: $d_2$
  notion: fpp/formule-black-scholes
  ref: §6.4
  sens: second argument, $d_2=d_1-\sigma\sqrt{T}$
- symbole: $q$
  notion: fpp/formule-black-scholes
  ref: §6.4
  sens: taux de dividende continu
- symbole: $\mathcal{L}$
  notion: fpp/feynman-kac
  ref: éq. 18
  sens: générateur infinitésimal d'une diffusion
- symbole: $\delta$
  notion: fpp/delta
  ref: §8.2
  sens: sensibilité du prix au sous-jacent
- symbole: $\gamma$
  notion: fpp/gamma
  ref: §8.2
  sens: sensibilité du delta au sous-jacent
- symbole: $\mathcal{V}$
  notion: fpp/vega
  ref: §8.2
  sens: sensibilité du prix à la volatilité
- symbole: $\Theta$
  notion: fpp/theta
  ref: §8.2
  sens: sensibilité du prix au temps qui passe
- symbole: $\rho$
  notion: fpp/rho
  ref: §8.2
  sens: sensibilité du prix au taux d'intérêt
collisions:
- symbole: $P$
  ici: zéro-coupon P(t,T)
  ailleurs:
    cs: probabilité historique
- symbole: $F$
  ici: prix forward
  ailleurs:
    cs: filtration F_t
- symbole: $d$
  ici: rendement continu de dividende (§5.2)
  ailleurs:
    fpp: d_1, d_2 de Black–Scholes (§6.4)
- symbole: $P$
  ici: prix d'un put, et prix d'une option en général dans la table des grecques (§6.4, §8.2)
  ailleurs:
    fpp: prix d'un zéro-coupon $P(t,T)$ (Déf. 3)
    dup: une loterie
  note: >-
    collision interne à la source, non signalée par le poly : $P$ sans argument est un
    prix d'option, $P(t,T)$ avec deux arguments est un zéro-coupon
