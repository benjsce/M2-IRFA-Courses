collisions:
- symbole: $P$
  ici: zéro-coupon P(t,T)
  note: >-
    en calcul stochastique, $P$ note la probabilité historique. Ce cours n'est pas dans
    la base ; la note est là pour l'étudiant qui lira les deux, pas pour le validateur
- symbole: $F$
  ici: prix forward
  note: >-
    en calcul stochastique, $\mathcal F_t$ note la filtration. Même remarque que pour $P$
- symbole: $d$
  ici: rendement continu de dividende (§5.2)
  ailleurs:
    fpp: d_1, d_2 de Black–Scholes (§6.4)
- symbole: $P$
  ici: prix d'un put, et prix d'une option en général dans la table des grecques (§6.4, §8.2)
  ailleurs:
    fpp: prix d'un zéro-coupon $P(t,T)$ (Déf. 3)
    dup: une loterie
  note: >-
    collision interne à la source, non signalée par le poly : $P$ sans argument est un
    prix d'option, $P(t,T)$ avec deux arguments est un zéro-coupon
- symbole: $P(t,r)$
  ici: zéro-coupon écrit en fonction de sa maturité t et du taux r (Déf. 5)
  ailleurs:
    fpp: $P(t,T)$, où les deux arguments sont deux dates (Déf. 3)
  note: >-
    collision interne à la source, non signalée par le poly : la même lettre, deux
    arguments dans les deux cas, mais le second est une date en Déf. 3 et un taux en
    Déf. 5, et le premier une date d'un côté, une durée de l'autre
- symbole: $l$
  ici: levier $l_t=A_t/E_t$, dans $[1,\infty)$ (Déf. 1, §1.3)
  ailleurs:
    fpp: >-
      ratio dette sur actif $l=D/F_T$, dans $[0,1]$, dans le livre d'exercices (exo. 16)
  note: >-
    collision entre les deux documents du même cours, non signalée par eux. Même lettre,
    même mot « levier », et les deux quantités varient en sens inverse : le levier du poly
    croît quand la firme s'endette, celui du livre aussi, mais le premier part de 1 et n'a
    pas de borne, le second va de 0 à 1. La table de l'exercice 16 donne l = 2 et l = 4,
    hors du domaine que l'exercice lui-même définit ; voir fpp/ex-16.
- symbole: $X_t$
  ici: nombre d'unités de devise étrangère pour une unité de devise locale (§2.4)
  ailleurs:
    fpp: >-
      valeur d'une unité de devise étrangère en monnaie locale, dans le livre d'exercices
      (exo. 9, exo. 13, exo. 18)
  note: >-
    conventions inverses l'une de l'autre entre le poly et le livre d'exercices. Le poly
    écrit le forward $X_te^{(R^f-R)\tau}$, le livre $X_te^{(r_l-r_f)\tau}$ : chacun est
    juste dans sa convention. C'est la collision la plus dangereuse du cours, parce que
    les deux formules se ressemblent.
- symbole: $F(t,T)$
  ici: prix forward d'une action (Déf. 8)
  ailleurs:
    fpp: >-
      taux de change à terme dans le livre d'exercices (exo. 9, exo. 13, exo. 19), que le
      poly note $K(t,T)$ (§2.4)

